services:
  - type: web
    name: vocab-builder
    runtime: node
    plan: starter # use "free" for testing, but note the free tier spins down on inactivity (cold start on next request)
    branch: main
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        sync: false # paste the Supabase connection string manually in the Render dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true # Render generates a random secure value for you